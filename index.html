  .tagline { width: 80.3%; margin-top: 1.2%; }
  footer { display: flex; justify-content: center; }
  .copy { width: clamp(180px, 25.5vw, 490px); }
  @media (max-width: 640px) {
    .mark { width: 100%; }
    .copy { width: 60%; }

  @media (prefers-reduced-motion: reduce) { .mail { transition: none; } }
